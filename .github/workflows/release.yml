---
name: Release

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - 'v*'
  # Lets the packaging path be exercised without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The oldest supported Ruby, on purpose: Gemfile.lock is resolved for it and
      # script/release-assets explains why the release is built with it.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # A tag that fails its own tests is worse than a missing release.
      - name: Verify before releasing
        run: bundle exec rake

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(ruby -Ilib -rovlens/version -e 'print Ovlens::VERSION')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag is $GITHUB_REF_NAME but lib/ovlens/version.rb says $version" >&2
            exit 1
          fi

      # Everything below ships the versions Gemfile.lock pins.
      - name: Build the gems and the package tree
        run: script/release-assets

      - name: Build the rpm and deb
        run: script/package

      # The harpworks repository (miharp/packages) picks the packages and gems
      # up from the release within the hour and serves them at
      # packages.harpworks.org.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/
          retention-days: 14
